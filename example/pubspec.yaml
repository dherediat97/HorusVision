name: horus_example_app
description: "Horus Example App"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'
dependencies:
  flutter:
    sdk: flutter

  go_router: ^14.2.0
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  horusvision:
    path: ../
  horus_vision_engine:
    path: ../../horusvisionengine/

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets: 
    - assets/
    - assets/immersive_film.glb
